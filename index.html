<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div class="phone-notch"></div>

    <nav class="page-dots" id="pageDots" aria-label="News sections">
      <button type="button" class="dot active" data-color="teal" aria-label="World" aria-current="page"></button>
      <button type="button" class="dot" data-color="violet" aria-label="Europe"></button>
      <button type="button" class="dot" data-color="amber" aria-label="Lietuva"></button>
      <button type="button" class="dot" data-color="blue" aria-label="Tech"></button>
      <button type="button" class="dot" data-color="orange" aria-label="Sports"></button>
      <button type="button" class="dot" data-color="gold" aria-label="Other"></button>
    </nav>

    <div class="pages-wrapper" id="pagesWrapper">

      <section class="page" data-category="world" data-accent="#0e7490" data-accent-rgb="14,116,144">
        <div class="page-inner">
          <p class="page-label">TODAY'S BRIEF</p>
          <h1 class="page-title title-world">WORLD</h1>
          <p class="page-updated" id="worldUpdated">Loading…</p>
          <p class="page-stale" id="worldStale" data-stale hidden></p>

          <hr class="divider">

          <div id="worldStories"></div>

          <button type="button" class="page-swipe-hint" aria-label="Next news section">
            <span>SWIPE LEFT FOR MORE</span>
            <span class="arrow" aria-hidden="true">&longrightarrow;</span>
          </button>
        </div>
      </section>

      <section class="page" data-category="europe" data-accent="#4f46e5" data-accent-rgb="79,70,229">
        <div class="page-inner">
          <p class="page-label">TODAY'S BRIEF</p>
          <h1 class="page-title title-europe">EUROPE</h1>
          <p class="page-updated" data-stamp>Loading…</p>
          <p class="page-stale" data-stale hidden></p>

          <hr class="divider">

          <div id="europeStories"></div>
        </div>
      </section>

      <section class="page" data-category="lietuva" data-accent="#b45309" data-accent-rgb="180,83,9">
        <div class="page-inner">
          <p class="page-label">TODAY'S BRIEF</p>
          <h1 class="page-title title-lietuva">LIETUVA</h1>
          <p class="page-updated" data-stamp>Loading…</p>
          <p class="page-stale" data-stale hidden></p>

          <hr class="divider">

          <div id="lietuvaStories"></div>
        </div>
      </section>

      <section class="page" data-category="tech" data-accent="#2563eb" data-accent-rgb="37,99,235">
        <div class="page-inner">
          <p class="page-label">TODAY'S BRIEF</p>
          <h1 class="page-title title-tech">TECH</h1>
          <p class="page-updated" data-stamp>Loading…</p>
          <p class="page-stale" data-stale hidden></p>

          <hr class="divider">

          <div id="techStories"></div>
        </div>
      </section>

      <section class="page" data-category="sports" data-accent="#c2410c" data-accent-rgb="194,65,12">
        <div class="page-inner">
          <p class="page-label">TODAY'S BRIEF</p>
          <h1 class="page-title title-sports">SPORTS</h1>
          <p class="page-updated" data-stamp>Loading…</p>
          <p class="page-stale" data-stale hidden></p>

          <hr class="divider">

          <div id="sportsStories"></div>
        </div>
      </section>

      <section class="page" data-category="other" data-accent="#a16207" data-accent-rgb="161,98,7">
        <div class="page-inner">
          <p class="page-label">TODAY'S BRIEF</p>
          <h1 class="page-title title-other">OTHER</h1>
          <p class="page-updated" data-stamp>Loading…</p>
          <p class="page-stale" data-stale hidden></p>

          <hr class="divider">

          <div id="otherStories"></div>
        </div>
      </section>

    </div><!-- /pages-wrapper -->
  </div><!-- /phone-frame -->

  <script src="app.js"></script>
  <script src="render.js"></script>
</body>
</html>
